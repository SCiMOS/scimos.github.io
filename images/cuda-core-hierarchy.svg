<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" style="background:#070908">
  <defs>
    <style>
      text { font-family: 'JetBrains Mono', 'Consolas', monospace; fill: #c8d8c8; }
      .label { font-size: 11px; fill: #6a8a6a; }
      .title { font-size: 13px; font-weight: bold; fill: #62de61; }
      .dim { fill: #3d5a3d; }
      .green { fill: #62de61; }
      .blue { fill: #5b9bd5; }
    </style>
  </defs>

  <!-- Title -->
  <text x="320" y="28" text-anchor="middle" class="title" font-size="14">GPU Thread Hierarchy</text>
  <line x1="180" y1="36" x2="460" y2="36" stroke="#1e2a1e" stroke-width="1"/>

  <!-- Grid box -->
  <rect x="20" y="50" width="600" height="350" rx="4" fill="none" stroke="#2d402d" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="30" y="70" class="label">GRID  (kernel launch)</text>

  <!-- Block row 1 -->
  <rect x="40" y="80" width="170" height="140" rx="3" fill="#0d0f0d" stroke="#1e4a1e" stroke-width="1"/>
  <text x="50" y="98" class="label">BLOCK (0,0)</text>

  <!-- Warps inside block 0,0 -->
  <rect x="52" y="105" width="146" height="38" rx="2" fill="#0f120f" stroke="#2d402d" stroke-width="1"/>
  <text x="60" y="121" class="label" font-size="10">Warp 0  (threads 0–31)</text>
  <g>
    {#each [0,1,2,3,4,5,6,7] as i}
    <rect x={60 + i*16} y="127" width="12" height="10" rx="1" fill="#1e4a1e" stroke="#3a8a3a" stroke-width="0.5"/>
    {/each}
  </g>

  <rect x="52" y="148" width="146" height="38" rx="2" fill="#0f120f" stroke="#2d402d" stroke-width="1"/>
  <text x="60" y="164" class="label" font-size="10">Warp 1  (threads 32–63)</text>

  <rect x="52" y="191" width="146" height="22" rx="2" fill="#0a0c0a" stroke="#1e2a1e" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="125" y="205" text-anchor="middle" class="dim" font-size="10">· · ·</text>

  <!-- 8 thread squares in warp 0 -->
  <rect x="60"  y="127" width="12" height="10" rx="1" fill="#1e4a1e" stroke="#3a8a3a" stroke-width="0.5"/>
  <rect x="76"  y="127" width="12" height="10" rx="1" fill="#1e4a1e" stroke="#3a8a3a" stroke-width="0.5"/>
  <rect x="92"  y="127" width="12" height="10" rx="1" fill="#1e4a1e" stroke="#3a8a3a" stroke-width="0.5"/>
  <rect x="108" y="127" width="12" height="10" rx="1" fill="#1e4a1e" stroke="#3a8a3a" stroke-width="0.5"/>
  <rect x="124" y="127" width="12" height="10" rx="1" fill="#62de61" stroke="#7eff7d" stroke-width="0.5"/>
  <rect x="140" y="127" width="12" height="10" rx="1" fill="#62de61" stroke="#7eff7d" stroke-width="0.5"/>
  <rect x="156" y="127" width="12" height="10" rx="1" fill="#1e4a1e" stroke="#3a8a3a" stroke-width="0.5"/>
  <rect x="172" y="127" width="12" height="10" rx="1" fill="#1e4a1e" stroke="#3a8a3a" stroke-width="0.5"/>
  <text x="210" y="134" class="label" font-size="9" fill="#62de61">← active threads</text>

  <!-- Block 0,1 -->
  <rect x="230" y="80" width="170" height="140" rx="3" fill="#0d0f0d" stroke="#1e4a1e" stroke-width="1"/>
  <text x="240" y="98" class="label">BLOCK (0,1)</text>
  <rect x="242" y="105" width="146" height="38" rx="2" fill="#0f120f" stroke="#2d402d" stroke-width="1"/>
  <text x="250" y="121" class="label" font-size="10">Warp 0  (threads 0–31)</text>
  <rect x="242" y="148" width="146" height="38" rx="2" fill="#0f120f" stroke="#2d402d" stroke-width="1"/>
  <text x="250" y="164" class="label" font-size="10">Warp 1  (threads 32–63)</text>
  <rect x="242" y="191" width="146" height="22" rx="2" fill="#0a0c0a" stroke="#1e2a1e" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="315" y="205" text-anchor="middle" class="dim" font-size="10">· · ·</text>

  <!-- Block (1,0) -->
  <rect x="420" y="80" width="170" height="140" rx="3" fill="#0d0f0d" stroke="#1e4a1e" stroke-width="1"/>
  <text x="430" y="98" class="label">BLOCK (1,0)</text>
  <rect x="432" y="105" width="146" height="38" rx="2" fill="#0f120f" stroke="#2d402d" stroke-width="1"/>
  <text x="440" y="121" class="label" font-size="10">Warp 0  (threads 0–31)</text>
  <rect x="432" y="148" width="146" height="38" rx="2" fill="#0f120f" stroke="#2d402d" stroke-width="1"/>
  <text x="440" y="164" class="label" font-size="10">Warp 1  (threads 32–63)</text>
  <rect x="432" y="191" width="146" height="22" rx="2" fill="#0a0c0a" stroke="#1e2a1e" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="505" y="205" text-anchor="middle" class="dim" font-size="10">· · ·</text>

  <!-- More blocks ellipsis -->
  <text x="320" y="240" text-anchor="middle" class="dim" font-size="13">· · · more blocks · · ·</text>

  <!-- SM mapping diagram -->
  <line x1="40" y1="260" x2="600" y2="260" stroke="#1e2a1e" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="320" y="278" text-anchor="middle" class="label" font-size="11" fill="#3a8a3a">Blocks are scheduled onto Streaming Multiprocessors (SMs)</text>

  <!-- SM boxes -->
  <rect x="60"  y="290" width="110" height="50" rx="3" fill="#111411" stroke="#2d402d" stroke-width="1"/>
  <text x="115" y="308" text-anchor="middle" class="title" font-size="11">SM 0</text>
  <text x="115" y="326" text-anchor="middle" class="label" font-size="10">Block (0,0)</text>

  <rect x="190" y="290" width="110" height="50" rx="3" fill="#111411" stroke="#2d402d" stroke-width="1"/>
  <text x="245" y="308" text-anchor="middle" class="title" font-size="11">SM 1</text>
  <text x="245" y="326" text-anchor="middle" class="label" font-size="10">Block (0,1)</text>

  <rect x="320" y="290" width="110" height="50" rx="3" fill="#111411" stroke="#2d402d" stroke-width="1"/>
  <text x="375" y="308" text-anchor="middle" class="title" font-size="11">SM 2</text>
  <text x="375" y="326" text-anchor="middle" class="label" font-size="10">Block (1,0)</text>

  <rect x="450" y="290" width="110" height="50" rx="3" fill="#111411" stroke="#1e2a1e" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="505" y="316" text-anchor="middle" class="dim" font-size="12">· · ·</text>

  <!-- Legend -->
  <rect x="40" y="355" width="10" height="10" fill="#62de61"/>
  <text x="56" y="365" class="label" font-size="10" fill="#62de61">active thread</text>
  <rect x="140" y="355" width="10" height="10" fill="#1e4a1e" stroke="#3a8a3a" stroke-width="0.5"/>
  <text x="156" y="365" class="label" font-size="10">idle thread</text>
  <rect x="230" y="355" width="10" height="10" fill="none" stroke="#2d402d" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="246" y="365" class="label" font-size="10">truncated</text>
</svg>
