<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" width="620" height="340">
  <rect width="620" height="340" fill="#070908"/>
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; }
    </style>
  </defs>

  <!-- Title bar -->
  <rect x="0" y="0" width="620" height="32" fill="#0d0f0d"/>
  <circle cx="16" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="32" cy="16" r="5" fill="#febc2e"/>
  <circle cx="48" cy="16" r="5" fill="#28c840"/>
  <text x="310" y="21" text-anchor="middle" class="mono" fill="#3d5a3d" font-size="11">tensor-core-matmul.svg — D = A × B + C</text>

  <!-- Matrix A (4x4, left) -->
  <text x="88" y="60" text-anchor="middle" class="mono" fill="#62de61" font-size="12" font-weight="bold">A</text>
  <text x="88" y="74" text-anchor="middle" class="mono" fill="#3d5a3d" font-size="9">4×4  FP16</text>
  <!-- A grid -->
  <g stroke="#2d402d" stroke-width="0.8">
    <rect x="48" y="80" width="80" height="80" fill="#0f120f"/>
    <!-- cols -->
    <line x1="68" y1="80" x2="68" y2="160"/><line x1="88" y1="80" x2="88" y2="160"/>
    <line x1="108" y1="80" x2="108" y2="160"/>
    <!-- rows -->
    <line x1="48" y1="100" x2="128" y2="100"/><line x1="48" y1="120" x2="128" y2="120"/>
    <line x1="48" y1="140" x2="128" y2="140"/>
  </g>
  <!-- A values (highlight row 0) -->
  <rect x="48" y="80" width="80" height="20" fill="#1e4a1e"/>
  <text x="58" y="94"  class="mono" fill="#62de61" font-size="9">0.5</text>
  <text x="78" y="94"  class="mono" fill="#62de61" font-size="9">1.2</text>
  <text x="98" y="94"  class="mono" fill="#62de61" font-size="9">−0.3</text>
  <text x="58" y="114" class="mono" fill="#6a8a6a" font-size="9">0.8</text>
  <text x="78" y="114" class="mono" fill="#6a8a6a" font-size="9">0.1</text>
  <text x="98" y="114" class="mono" fill="#6a8a6a" font-size="9">0.9</text>
  <text x="58" y="134" class="mono" fill="#6a8a6a" font-size="9">−1</text>
  <text x="78" y="134" class="mono" fill="#6a8a6a" font-size="9">0.4</text>
  <text x="98" y="134" class="mono" fill="#6a8a6a" font-size="9">0.7</text>
  <text x="58" y="154" class="mono" fill="#6a8a6a" font-size="9">0.2</text>
  <text x="78" y="154" class="mono" fill="#6a8a6a" font-size="9">0.6</text>
  <text x="98" y="154" class="mono" fill="#6a8a6a" font-size="9">1.1</text>

  <!-- × operator -->
  <text x="148" y="126" text-anchor="middle" class="mono" fill="#3d5a3d" font-size="22">×</text>

  <!-- Matrix B (4x4) -->
  <text x="218" y="60" text-anchor="middle" class="mono" fill="#5b9bd5" font-size="12" font-weight="bold">B</text>
  <text x="218" y="74" text-anchor="middle" class="mono" fill="#3d5a3d" font-size="9">4×4  FP16</text>
  <g stroke="#1e3050" stroke-width="0.8">
    <rect x="178" y="80" width="80" height="80" fill="#0d1520"/>
    <!-- highlight col 0 -->
    <rect x="178" y="80" width="20" height="80" fill="#1e3050"/>
    <line x1="198" y1="80" x2="198" y2="160"/><line x1="218" y1="80" x2="218" y2="160"/>
    <line x1="238" y1="80" x2="238" y2="160"/>
    <line x1="178" y1="100" x2="258" y2="100"/><line x1="178" y1="120" x2="258" y2="120"/>
    <line x1="178" y1="140" x2="258" y2="140"/>
  </g>
  <text x="184" y="94"  class="mono" fill="#5b9bd5" font-size="9">0.7</text>
  <text x="204" y="94"  class="mono" fill="#6a8a6a" font-size="9">0.3</text>
  <text x="224" y="94"  class="mono" fill="#6a8a6a" font-size="9">1.0</text>
  <text x="184" y="114" class="mono" fill="#5b9bd5" font-size="9">−0.2</text>
  <text x="204" y="114" class="mono" fill="#6a8a6a" font-size="9">0.8</text>
  <text x="224" y="114" class="mono" fill="#6a8a6a" font-size="9">0.4</text>
  <text x="184" y="134" class="mono" fill="#5b9bd5" font-size="9">0.5</text>
  <text x="204" y="134" class="mono" fill="#6a8a6a" font-size="9">1.1</text>
  <text x="224" y="134" class="mono" fill="#6a8a6a" font-size="9">−0.6</text>
  <text x="184" y="154" class="mono" fill="#5b9bd5" font-size="9">0.9</text>
  <text x="204" y="154" class="mono" fill="#6a8a6a" font-size="9">0.2</text>
  <text x="224" y="154" class="mono" fill="#6a8a6a" font-size="9">0.3</text>

  <!-- + operator -->
  <text x="278" y="126" text-anchor="middle" class="mono" fill="#3d5a3d" font-size="22">+</text>

  <!-- Matrix C (4x4, accumulator) -->
  <text x="348" y="60" text-anchor="middle" class="mono" fill="#b07ad5" font-size="12" font-weight="bold">C</text>
  <text x="348" y="74" text-anchor="middle" class="mono" fill="#3d5a3d" font-size="9">4×4  FP32</text>
  <g stroke="#2d1a40" stroke-width="0.8">
    <rect x="308" y="80" width="80" height="80" fill="#120d1a"/>
    <line x1="328" y1="80" x2="328" y2="160"/><line x1="348" y1="80" x2="348" y2="160"/>
    <line x1="368" y1="80" x2="368" y2="160"/>
    <line x1="308" y1="100" x2="388" y2="100"/><line x1="308" y1="120" x2="388" y2="120"/>
    <line x1="308" y1="140" x2="388" y2="140"/>
  </g>
  <text x="314" y="94"  class="mono" fill="#b07ad5" font-size="9">1.4</text>
  <text x="334" y="94"  class="mono" fill="#b07ad5" font-size="9">0.0</text>
  <text x="354" y="94"  class="mono" fill="#b07ad5" font-size="9">0.5</text>
  <text x="314" y="114" class="mono" fill="#b07ad5" font-size="9">0.2</text>
  <text x="334" y="114" class="mono" fill="#b07ad5" font-size="9">−0.7</text>
  <text x="354" y="114" class="mono" fill="#b07ad5" font-size="9">1.1</text>
  <text x="314" y="134" class="mono" fill="#b07ad5" font-size="9">0.9</text>
  <text x="334" y="134" class="mono" fill="#b07ad5" font-size="9">0.3</text>
  <text x="354" y="134" class="mono" fill="#b07ad5" font-size="9">−0.2</text>
  <text x="314" y="154" class="mono" fill="#b07ad5" font-size="9">0.6</text>
  <text x="334" y="154" class="mono" fill="#b07ad5" font-size="9">1.8</text>
  <text x="354" y="154" class="mono" fill="#b07ad5" font-size="9">0.1</text>

  <!-- = operator -->
  <text x="408" y="126" text-anchor="middle" class="mono" fill="#3d5a3d" font-size="22">=</text>

  <!-- Matrix D (result) -->
  <text x="478" y="60" text-anchor="middle" class="mono" fill="#febc2e" font-size="12" font-weight="bold">D</text>
  <text x="478" y="74" text-anchor="middle" class="mono" fill="#3d5a3d" font-size="9">4×4  FP32</text>
  <g stroke="#302010" stroke-width="0.8">
    <rect x="438" y="80" width="80" height="80" fill="#141008"/>
    <!-- highlight result cell [0,0] -->
    <rect x="438" y="80" width="20" height="20" fill="#3a2800" stroke="#febc2e" stroke-width="1"/>
    <line x1="458" y1="80" x2="458" y2="160"/><line x1="478" y1="80" x2="478" y2="160"/>
    <line x1="498" y1="80" x2="498" y2="160"/>
    <line x1="438" y1="100" x2="518" y2="100"/><line x1="438" y1="120" x2="518" y2="120"/>
    <line x1="438" y1="140" x2="518" y2="140"/>
  </g>
  <text x="440" y="94"  class="mono" fill="#febc2e" font-size="9" font-weight="bold">2.38</text>
  <text x="463" y="94"  class="mono" fill="#c8d8c8" font-size="9">0.69</text>
  <text x="484" y="94"  class="mono" fill="#c8d8c8" font-size="9">1.29</text>
  <text x="440" y="114" class="mono" fill="#c8d8c8" font-size="9">1.15</text>
  <text x="463" y="114" class="mono" fill="#c8d8c8" font-size="9">0.02</text>
  <text x="484" y="114" class="mono" fill="#c8d8c8" font-size="9">1.43</text>
  <text x="440" y="134" class="mono" fill="#c8d8c8" font-size="9">1.26</text>
  <text x="463" y="134" class="mono" fill="#c8d8c8" font-size="9">1.79</text>
  <text x="484" y="134" class="mono" fill="#c8d8c8" font-size="9">0.36</text>
  <text x="440" y="154" class="mono" fill="#c8d8c8" font-size="9">2.24</text>
  <text x="463" y="154" class="mono" fill="#c8d8c8" font-size="9">2.93</text>
  <text x="484" y="154" class="mono" fill="#c8d8c8" font-size="9">0.43</text>

  <!-- Annotation: dot product for D[0,0] -->
  <path d="M128,90 Q200,170 270,165" fill="none" stroke="#1e4a1e" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M198,90 Q200,170 270,165" fill="none" stroke="#1e3050" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="447" cy="90" r="3" fill="#febc2e"/>
  <text x="310" y="195" text-anchor="middle" class="mono" fill="#3d5a3d" font-size="9">D[0,0] = row₀(A) · col₀(B) + C[0,0]</text>
  <text x="310" y="208" text-anchor="middle" class="mono" fill="#3d5a3d" font-size="9">= (0.5×0.7 + 1.2×−0.2 + −0.3×0.5) + 1.4</text>
  <text x="310" y="221" text-anchor="middle" class="mono" fill="#febc2e" font-size="9">= 0.98 + 1.4 = 2.38 ✓</text>

  <!-- Tensor Core chip diagram -->
  <rect x="50" y="245" width="520" height="72" rx="4" fill="#111411" stroke="#1e4a1e" stroke-width="1"/>
  <text x="310" y="264" text-anchor="middle" class="mono" fill="#62de61" font-size="11" font-weight="bold">Tensor Core  (4th gen, Hopper)</text>
  <!-- pipeline stages -->
  <rect x="70"  y="272" width="90" height="28" rx="2" fill="#0f120f" stroke="#2d402d"/>
  <text x="115" y="290" text-anchor="middle" class="mono" fill="#6a8a6a" font-size="9">Load A/B/C</text>
  <text x="165" y="287" class="mono" fill="#3d5a3d" font-size="14">→</text>
  <rect x="177" y="272" width="90" height="28" rx="2" fill="#0f120f" stroke="#1e4a1e"/>
  <text x="222" y="290" text-anchor="middle" class="mono" fill="#62de61" font-size="9">MMA (1 cycle)</text>
  <text x="272" y="287" class="mono" fill="#3d5a3d" font-size="14">→</text>
  <rect x="284" y="272" width="90" height="28" rx="2" fill="#0f120f" stroke="#2d402d"/>
  <text x="329" y="290" text-anchor="middle" class="mono" fill="#6a8a6a" font-size="9">Accumulate</text>
  <text x="379" y="287" class="mono" fill="#3d5a3d" font-size="14">→</text>
  <rect x="391" y="272" width="90" height="28" rx="2" fill="#0f120f" stroke="#302010"/>
  <text x="436" y="290" text-anchor="middle" class="mono" fill="#febc2e" font-size="9">Write D (FP32)</text>
  <text x="486" y="287" class="mono" fill="#3d5a3d" font-size="14">→</text>
  <text x="510" y="290" class="mono" fill="#3d5a3d" font-size="9">✓</text>

  <!-- Throughput note -->
  <text x="310" y="332" text-anchor="middle" class="mono" fill="#3d5a3d" font-size="10">1 Tensor Core performs 64 FP16 FMAs (128 FLOP) per clock cycle</text>
  <text x="310" y="347" text-anchor="middle" class="mono" fill="#62de61" font-size="9">H100: 528 Tensor Cores × 128 FLOP × 1,830 MHz ≈ 989 TFLOPS (FP16)</text>
</svg>
